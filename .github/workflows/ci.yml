name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      # Action revisions are pinned to commit SHAs; upstream versions are listed in
      # docs/DEPENDENCIES.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # FFmpeg is an external tool (never bundled). The media tests fail, not skip, when it
      # is missing, so provisioning is explicit. The runner images' package managers
      # supply a build with libx264; the tests assert libx264 and aac are present.
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Show FFmpeg version
        run: |
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

      # Creates backend/.venv, installs Python packages with --only-binary=:all:
      # and frontend packages with npm ci.
      - name: Install dependencies
        run: npm run setup

      # Backend lint and tests (including golden cases and real-FFmpeg media tests with
      # generated lavfi fixtures), generated-contract drift check, frontend lint, type
      # check, tests and production build, and the Python/npm license-policy checks.
      - name: Run all checks
        run: npm test
